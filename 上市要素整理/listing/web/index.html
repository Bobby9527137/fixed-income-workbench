<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上市要素整理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>上市要素整理</h1>
      <p class="sub">粘贴任意排版的要素文本，整理成固定模版。</p>
    </div>
    <span class="badge">本地运行 · 不联网</span>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>原始文本</h2>
        <div class="actions">
          <button id="mock" class="ghost" type="button">随机示例</button>
          <button id="clear" class="ghost" type="button">清空</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false"
        placeholder="把聊天记录、公告或零散的要素粘到这里……&#10;&#10;顺序、标点、全角半角都不影响识别。"></textarea>
      <p class="hint">字段位置可以任意打乱；缺失的字段会在右侧标红，可手动补。</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>整理结果</h2>
        <div class="actions">
          <button id="copy" class="primary" type="button">复制</button>
        </div>
      </div>
      <pre id="output" class="output" aria-live="polite"></pre>
      <div id="warnings" class="warnings" hidden></div>

      <div class="fields-block">
        <div class="fields-head">
          <h3>识别到的字段</h3>
          <span id="status" class="status"></span>
        </div>
        <div id="fields" class="fields"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    只在本机运行，不访问网络；所有解析都在本地完成。
  </footer>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
